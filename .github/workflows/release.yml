name: Release

# Every push to main publishes a rolling "latest" release, so the download on
# the website is always the current build. Tagging additionally cuts a numbered
# release that stays put.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out what we are publishing
        id: v
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}"          >> "$GITHUB_OUTPUT"
            echo "name=Pico ${{ github.ref_name }}"    >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                    >> "$GITHUB_OUTPUT"
            echo "rolling=false"                       >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                          >> "$GITHUB_OUTPUT"
            echo "name=Pico (latest)"                  >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                    >> "$GITHUB_OUTPUT"
            echo "rolling=true"                        >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)"     >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)"             >> "$GITHUB_OUTPUT"

      # Everything needed to run Pico, minus the two large Windows binaries,
      # which are attached separately because git cannot carry them.
      - name: Package
        run: |
          set -euo pipefail
          STAGE=out/Pico
          mkdir -p "$STAGE"
          cp -r pico-ui phone bridge "$STAGE"/
          cp README.md SAFETY.md WINDOWS-TEST.md install.ps1 .env.example "$STAGE"/
          cp "Start Pico.cmd" "$STAGE"/
          rm -rf "$STAGE"/pico-ui/mock/audit-sample.jsonl

          # The updater compares this against the SHA in the release body.
          cat > "$STAGE"/build.json <<JSON
          {
            "sha": "${{ steps.v.outputs.sha }}",
            "date": "${{ steps.v.outputs.date }}",
            "tag": "${{ steps.v.outputs.tag }}"
          }
JSON

          printf '%s\n' \
            "Pico" \
            "build ${{ steps.v.outputs.sha }} — ${{ steps.v.outputs.date }}" \
            "" \
            "1. Install Node.js (https://nodejs.org) if you have not already." \
            "2. Double-click \"Start Pico.cmd\"." \
            "3. Paste your OpenAI key into the .env file it opens, save, run it again." \
            > "$STAGE"/READ-ME-FIRST.txt

          cd out
          zip -qr "Pico-latest.zip" Pico
          sha256sum Pico-latest.zip > SHA256SUMS.txt
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"

          # A rolling release has to be retagged to the new commit, or the
          # assets and the source drift apart.
          if [[ "${{ steps.v.outputs.rolling }}" == "true" ]]; then
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
          fi

          NOTES="Build \`${{ steps.v.outputs.sha }}\` — ${{ steps.v.outputs.date }}

          **Start here:** download \`Pico-latest.zip\`, unzip, double-click **Start Pico.cmd**.
          Needs [Node.js](https://nodejs.org) and an OpenAI API key.

          The Windows binaries (\`Pico.exe\`, \`Pico.Guardian.exe\`) are attached to the
          numbered releases; they carry the older interface."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${{ steps.v.outputs.name }}" --notes "$NOTES" --latest
            gh release upload "$TAG" out/Pico-latest.zip out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "${{ steps.v.outputs.name }}" \
              --notes "$NOTES" \
              --latest \
              out/Pico-latest.zip out/SHA256SUMS.txt
          fi

      - name: Summary
        run: |
          {
            echo "Published **${{ steps.v.outputs.tag }}** (${{ steps.v.outputs.sha }})"
            echo ""
            echo "The website reads the newest release at page load, so the download is now current."
          } >> "$GITHUB_STEP_SUMMARY"
