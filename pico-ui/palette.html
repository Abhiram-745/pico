<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico palette</title>
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/motion.css">
<link rel="stylesheet" href="src/palette.css">
<style>
  /* WebView2 target #2. The host window is transparent, centred and
     activatable (unlike the companion, which is WS_EX_NOACTIVATE). */
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body.is-preview { background: #0b1020; }
</style>
</head>
<body>
<script type="module">
  import { store } from './src/store.js';
  import { connect, bridge } from './src/bridge.js';
  import { mountPalette } from './src/palette.js';
  import { installHotkeys } from './src/hotkeys.js';

  const { mode, transport } = connect();
  const palette = mountPalette(document.body);

  if (mode === 'mock') {
    document.body.classList.add('is-preview');
    const { MockAgent } = await import('./mock/agent.js');
    const agent = new MockAgent(transport);
    agent.start();
    installHotkeys({ palette, onModifiers: (m) => agent.setHeldModifiers(m) });
    palette.open();
    window.pico = { store, agent, palette, bridge };
  } else {
    // The host owns the global chords and tells us when to show.
    installHotkeys({ palette });
    palette.open();
  }
</script>
</body>
</html>
