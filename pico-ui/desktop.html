<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico</title>
<link rel="icon" href="../phone/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/motion.css">
<link rel="stylesheet" href="src/palette.css">
<link rel="stylesheet" href="src/notch.css">
<link rel="stylesheet" href="src/cursors.css">
<style>
  /* A stand-in desktop so the notch and the cursors can be judged in place.
     In the Windows host this page is transparent and click-through except
     where the notch paints. */
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--ink-0);
    /* A plausible desktop wallpaper, not a mesh of glowing orbs. The
       purple-and-cyan radial stack is the most recognisable AI-design
       fingerprint there is, and it was ours. One hue, one light source. */
    background-image:
      linear-gradient(168deg, #17243c 0%, #0d1526 46%, #080c16 100%),
      var(--noise);
    background-blend-mode: normal, overlay;
    background-attachment: fixed;
    transition: background-image .9s var(--ease-out);
  }

  .wall { position: fixed; inset: 0; z-index: 0; }
  .win {
    position: absolute;
    border-radius: 11px;
    background: rgba(11, 16, 30, .8);
    border: 1px solid rgba(255, 255, 255, .07);
    box-shadow: 0 34px 80px -24px rgba(0, 0, 0, .85);
    overflow: hidden;
  }
  .win__bar { height: 30px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.06); display:flex; align-items:center; gap:6px; padding:0 11px; }
  .win__bar i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.15); }
  .win__bar span { margin-left: 6px; font-size: 11px; color: var(--text-dim); }
  .win__body { padding: 14px; display: grid; gap: 8px; }
  .win__row { height: 9px; border-radius: 3px; background: rgba(255,255,255,.055); }

  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px; z-index: 70;
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass-bg); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    font-size: 11.5px; color: var(--text-dim); white-space: nowrap;
  }
  .hint b { color: var(--text-mid); font-weight: 550; }
  .hint button {
    border: 0; background: color-mix(in oklab, #fff 8%, transparent); color: var(--text-mid);
    font: inherit; font-size: 11px; padding: 3px 9px; border-radius: 7px; cursor: pointer;
  }
  .hint button:hover { color: var(--text-hi); background: color-mix(in oklab, #fff 14%, transparent); }

  .conn { position: fixed; top: 10px; right: 16px; z-index: 70; display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-dim); }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-5); }
  [data-conn="connected"] .conn i { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,.6); }
  [data-conn="connecting"] .conn i, [data-conn="reconnecting"] .conn i { background: #fbbf24; }
</style>
</head>
<body>

<div class="wall">
  <div class="win" style="left:5%;top:16%;width:44%;height:50%">
    <div class="win__bar"><i></i><i></i><i></i><span>Chrome</span></div>
    <div class="win__body">
      <div class="win__row" style="width:70%"></div><div class="win__row" style="width:90%"></div>
      <div class="win__row" style="width:55%"></div><div class="win__row" style="width:80%"></div>
      <div class="win__row" style="width:40%"></div>
    </div>
  </div>
  <div class="win" style="left:40%;top:42%;width:42%;height:44%">
    <div class="win__bar"><i></i><i></i><i></i><span>Notepad</span></div>
    <div class="win__body">
      <div class="win__row" style="width:60%"></div><div class="win__row" style="width:85%"></div>
      <div class="win__row" style="width:45%"></div>
    </div>
  </div>
</div>

<div class="conn"><i></i><span id="conn-text">Connecting</span></div>

<div class="hint">
  <span><b>Click the notch</b> to open it</span>
  <button id="demo">Run 3 cursors</button>
</div>

<script type="module">
  import { store } from './src/store.js';
  import { connect } from './src/bridge.js';
  import { mountNotch } from './src/notch.js';
  import { mountPalette } from './src/palette.js';
  import { installHotkeys } from './src/hotkeys.js';

  const setConn = (s) => {
    document.body.dataset.conn = s;
    document.getElementById('conn-text').textContent =
      ({ connected: 'Bridge connected', connecting: 'Connecting', reconnecting: 'Reconnecting', offline: 'Local' })[s] || s;
  };

  const { mode, transport } = connect({ onStatus: setConn });

  const notch = mountNotch(document.body);
  const palette = mountPalette(document.body);
  installHotkeys({ palette });

  if (mode === 'mock') {
    setConn('offline');
    const { MockAgent } = await import('./mock/agent.js');
    const agent = new MockAgent(transport);
    agent.start();
    window.pico = { store, agent, notch, palette };
  } else {
    window.pico = { store, notch, palette };
  }

  store.subscribe((s) => { document.body.dataset.phase = s.phase; });

  /* Demo: three cursors working at once, each on its own target. This is what
     concurrency looks like — none of them owns the system pointer, so they
     genuinely overlap in time rather than taking turns. */
  const TARGETS = [
    [[0.14, 0.34], [0.32, 0.46], [0.22, 0.56], [0.41, 0.38]],
    [[0.62, 0.58], [0.74, 0.68], [0.55, 0.74], [0.70, 0.52]],
    [[0.46, 0.24], [0.30, 0.30], [0.52, 0.42], [0.38, 0.62]],
  ];
  const WORK = ['Reading the page', 'Clicking the result', 'Typing the query', 'Checking the total'];

  document.getElementById('demo').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    notch.setAgentCount(3);
    notch.open('agents');

    await Promise.all(notch.cursorLayer.all().map(async (c, i) => {
      const path = TARGETS[i % TARGETS.length];
      for (let s = 0; s < path.length; s++) {
        const [fx, fy] = path[s];
        await notch.driveCursor(c.id, {
          x: fx * innerWidth, y: fy * innerHeight,
          state: 'working', task: WORK[s % WORK.length], click: true,
        });
        await new Promise(r => setTimeout(r, 220 + Math.random() * 320));
      }
      await notch.driveCursor(c.id, { state: 'idle', task: 'Done' });
    }));

    btn.disabled = false;
  });
</script>
</body>
</html>
