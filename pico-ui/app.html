<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico</title>
<meta name="description" content="Pico reads your Windows desktop and works it, and stops to ask before anything it cannot undo.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="../phone/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/motion.css">
<link rel="stylesheet" href="src/palette.css">
<link rel="stylesheet" href="src/app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
  import { store } from './src/store.js';
  import { connect } from './src/bridge.js';
  import { mountApp } from './src/app.js';
  import { mountPalette } from './src/palette.js';
  import { installHotkeys } from './src/hotkeys.js';

  let app;
  const { mode, transport } = connect({ onStatus: (s) => app?.setConn(s) });

  // First run: nothing else is usable without a provider, so ask once here
  // rather than sending people to edit a file.
  const { needsSetup, mountSetup } = await import('./src/setup.js');
  if (await needsSetup()) {
    mountSetup(document.body, { onDone: () => window.location.reload() });
  }

  app = mountApp(document.body);
  const palette = mountPalette(document.body);
  installHotkeys({ palette });

  if (mode === 'mock') {
    app.setConn('offline');
    const { MockAgent } = await import('./mock/agent.js');
    const agent = new MockAgent(transport);
    agent.start();
    window.pico = { store, agent, app, palette };
  } else {
    window.pico = { store, app, palette };
  }
</script>
</body>
</html>
