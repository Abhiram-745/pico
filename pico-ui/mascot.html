<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico — mascot rig</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/motion.css">
<style>
  /* A harness, not a product surface — it exists so every pose, idle and
     one-shot can be seen next to each other, at every size the app renders
     the mascot at, against every background it has to read on. */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    font-family: var(--font, system-ui, sans-serif);
    color: #f5f5f7;
    background: #0b0d12;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } }

  .stage {
    display: grid;
    place-items: center;
    padding: 40px;
    background: var(--stage, #0b0d12);
    transition: background .3s ease;
  }
  .stage__inner { display: grid; gap: 28px; justify-items: center; }
  .sizes { display: flex; align-items: flex-end; gap: 30px; flex-wrap: wrap; justify-content: center; }
  .sizes figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
  .sizes figcaption { font-size: 11px; opacity: .45; font-variant-numeric: tabular-nums; }

  .panel {
    padding: 20px;
    background: #101319;
    border-left: 1px solid rgba(255,255,255,.07);
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .panel h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .45;
  }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .grid button {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.1);
    background: transparent;
    color: #d1d1d6;
    cursor: pointer;
  }
  .grid button:hover { background: rgba(255,255,255,.07); }
  .grid button[aria-pressed="true"] { background: #f5f5f7; color: #000; border-color: transparent; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); cursor: pointer; }
  .note { font-size: 11.5px; line-height: 1.5; opacity: .5; margin: 0; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stage__inner">
    <div class="sizes" id="sizes"></div>
  </div>
</div>

<div class="panel">
  <div>
    <h2>Phase</h2>
    <div class="grid" id="phases"></div>
  </div>
  <div>
    <h2>Activity</h2>
    <div class="grid" id="acts"></div>
  </div>
  <div>
    <h2>One-shot</h2>
    <div class="grid" id="shots"></div>
  </div>
  <div>
    <h2>Background</h2>
    <div class="swatches" id="bgs"></div>
  </div>
  <p class="note">
    Hover a mascot to make it hop — that is the only pointer gesture the rig
    reacts to, and it is deliberately separate from anything the surface
    around it does.
  </p>
</div>

<script type="module">
  import { Mascot } from './src/mascot.js';

  const PHASES = ['Idle', 'Starting', 'Observing', 'Thinking', 'Acting', 'Paused',
    'AwaitingApproval', 'AwaitingTakeover', 'Completed', 'Stopped', 'Failed'];
  const ACTS = ['none', 'writing', 'waving', 'listening'];
  const SHOTS = ['jump', 'cheer', 'nudge', 'pulse', 'blink'];
  const BGS = ['#0b0d12', '#000000', '#ffffff', '#f4f1ea', '#1b2a4a', '#123524', '#2a1440'];

  const SIZES = [26, 40, 72, 108, 190];
  const pets = SIZES.map((size) => {
    const fig = document.createElement('figure');
    const m = new Mascot({ size });
    // The hop is the mascot's own gesture: the pointer has to be on it.
    m.el.addEventListener('pointerenter', () => m.setHover(true));
    m.el.addEventListener('pointerleave', () => m.setHover(false));
    const cap = document.createElement('figcaption');
    cap.textContent = `${size}px`;
    fig.append(m.el, cap);
    document.getElementById('sizes').append(fig);
    return m;
  });

  const row = (host, items, onPick, initial) => {
    const buttons = items.map((name) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.addEventListener('click', () => {
        onPick(name);
        for (const other of buttons) other.setAttribute('aria-pressed', String(other === b));
      });
      host.append(b);
      return b;
    });
    if (initial) buttons[items.indexOf(initial)]?.setAttribute('aria-pressed', 'true');
    return buttons;
  };

  row(document.getElementById('phases'), PHASES,
    (p) => pets.forEach((m) => m.setPhase(p)), 'Idle');

  row(document.getElementById('acts'), ACTS,
    (a) => pets.forEach((m) => m.setActivity(a === 'none' ? null : a)), 'none');

  for (const name of SHOTS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = name;
    b.addEventListener('click', () => pets.forEach((m) => {
      if (name === 'pulse') m.pulse();
      else if (name === 'blink') m.blinkNow();
      else m[name]?.();
    }));
    document.getElementById('shots').append(b);
  }

  for (const c of BGS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => document.getElementById('stage').style.setProperty('--stage', c));
    document.getElementById('bgs').append(b);
  }

  window.pico = { pets };
</script>
</body>
</html>
